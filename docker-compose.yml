name: easy-health

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER:-easyhealth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-easyhealth}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - easy-health-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" --password=\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-easyhealth}?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: ${MYSQL_USER:-easyhealth}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env file}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_ACCESS_EXPIRES_MINUTES: ${JWT_ACCESS_EXPIRES_MINUTES:-15}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      RESET_CODE_LOG_ENABLED: ${RESET_CODE_LOG_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-3333}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI web opcional para inspecionar o banco — acesse em http://localhost:8080,
  # sistema "MySQL", servidor "db", com as credenciais do .env.
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  easy-health-mysql-data:
