name: easy-health

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easyhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easyhealth}
      POSTGRES_DB: ${POSTGRES_DB:-easyhealth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - easy-health-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easyhealth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-easyhealth}
      DB_USER: ${POSTGRES_USER:-easyhealth}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-easyhealth}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_ACCESS_EXPIRES_MINUTES: ${JWT_ACCESS_EXPIRES_MINUTES:-15}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      RESET_CODE_LOG_ENABLED: ${RESET_CODE_LOG_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-3333}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI web opcional para inspecionar o banco (útil para depuração e para a
  # apresentação do projeto) — acesse em http://localhost:8080, sistema
  # "PostgreSQL", servidor "db", com as mesmas credenciais do .env.
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  easy-health-db-data:
