server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/easyhealth}
spring.datasource.username=${DB_USER:easyhealth}
spring.datasource.password=${DB_PASSWORD:easyhealth}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

app.cors-origins=${CORS_ORIGIN:*}
app.access-token-minutes=${JWT_ACCESS_EXPIRES_MINUTES:15}
app.refresh-token-days=${JWT_REFRESH_EXPIRES_DAYS:7}
app.reset-code-log-enabled=${RESET_CODE_LOG_ENABLED:false}

logging.level.br.com.easyhealth=${APP_LOG_LEVEL:INFO}
